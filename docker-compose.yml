services:
  fileserver:
    # Gebruik het kant-en-klare image (aanbevolen); vervang door `build: .` om
    # lokaal te bouwen.
    image: ghcr.io/sevn132stack/fileserver:latest
    build: .
    ports:
      - "8080:8080"   # web UI
      - "2222:2222"   # SFTP
    # Leest automatisch je .env in (kopieer .env.example -> .env en vul in).
    # required:false zodat compose ook start zonder .env (de app genereert er
    # dan zelf één met een willekeurig wachtwoord in het /data-volume).
    env_file:
      - path: .env
        required: false
    environment:
      # Overschrijft .env indien gezet; laat TLS aan de reverse proxy over.
      TLS_ENABLED: "false"
    volumes:
      - fileserver-data:/data
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Automatische container-updates: Watchtower checkt periodiek op een nieuwer
  # image en herstart de fileserver. Verwijder deze service als je handmatig
  # wilt updaten.
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 86400
    restart: unless-stopped

volumes:
  fileserver-data:
