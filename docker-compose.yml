services:
  fileserver:
    # Lokaal gebouwd door docker/auto-deploy.sh. Er staat geen image meer in een
    # registry: bouwen en pushen vroeg een GitHub-hosted runner, en dat verbruik
    # was precies wat we kwijt wilden. De bron blijft GitHub (git).
    image: fileserver:lokaal
    build: .
    ports:
      - "8080:8080"   # web UI
      - "2222:2222"   # SFTP
    # Leest automatisch je .env in (kopieer .env.example -> .env en vul in).
    # required:false zodat compose ook start zonder .env (de app genereert er
    # dan zelf één met een willekeurig wachtwoord in het /data-volume).
    env_file:
      - path: .env
        required: false
    environment:
      # Overschrijft .env indien gezet; laat TLS aan de reverse proxy over.
      TLS_ENABLED: "false"
    volumes:
      - fileserver-data:/data
    restart: unless-stopped

volumes:
  fileserver-data:
