<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SFTP Fileserver</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; --danger:#f87171; --border:#334155; }
    :root[data-theme="light"] { --bg:#f1f5f9; --panel:#fff; --accent:#0284c7; --text:#0f172a; --muted:#64748b; --danger:#dc2626; --border:#cbd5e1; }
    /* Hoog-contrast-modus (toegankelijkheid): maximaal contrast + duidelijke randen. */
    :root.hc { --bg:#000; --panel:#000; --accent:#ffff00; --text:#fff; --muted:#e0e0e0; --danger:#ff5555; --border:#fff; }
    :root.hc button { outline:1px solid #fff; }
    :root.hc a { color:#ffff00; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
    header { background:var(--panel); padding:.9rem 1.5rem; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; border-bottom:1px solid var(--border); }
    header h1 { font-size:1.05rem; margin:0; }
    header .spacer { flex:1; }
    header .who { color:var(--muted); font-size:.85rem; }
    main { max-width:1000px; margin:1.2rem auto; padding:0 1rem; }
    .bar { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
    .crumbs { color:var(--muted); font-size:.9rem; word-break:break-all; }
    .crumbs a { color:var(--accent); cursor:pointer; text-decoration:none; }
    input, select { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:.45rem .6rem; }
    button { background:var(--accent); color:#04283a; border:none; padding:.5rem .8rem; border-radius:6px; cursor:pointer; font-weight:600; }
    :root[data-theme="light"] button { color:#fff; }
    button.ghost { background:var(--panel); color:var(--text); border:1px solid var(--border); }
    button.danger { background:transparent; color:var(--danger); border:1px solid var(--border); }
    button:hover { opacity:.9; }
    .quota { font-size:.8rem; color:var(--muted); }
    .quota .barwrap { height:6px; width:140px; background:var(--border); border-radius:3px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:.4rem; }
    .quota .barwrap > div { height:100%; background:var(--accent); }
    table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:8px; overflow:hidden; }
    th, td { text-align:left; padding:.5rem .8rem; border-bottom:1px solid var(--border); }
    th { color:var(--muted); font-weight:600; font-size:.72rem; text-transform:uppercase; }
    tr:last-child td { border-bottom:none; }
    .name { display:flex; align-items:center; gap:.5rem; cursor:pointer; }
    .thumb { width:28px; height:28px; object-fit:cover; border-radius:4px; }
    .actions { display:flex; gap:.3rem; justify-content:flex-end; flex-wrap:wrap; }
    .actions button { padding:.28rem .5rem; font-size:.76rem; }
    .muted { color:var(--muted); font-size:.85rem; }
    #drop { border:2px dashed var(--border); border-radius:8px; padding:1rem; text-align:center; color:var(--muted); margin-bottom:1rem; }
    #drop.over { border-color:var(--accent); color:var(--accent); }
    #progress { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin-top:.6rem; display:none; }
    #progress > div { height:100%; width:0; background:var(--accent); transition:width .1s; }
    #modal { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; padding:1rem; }
    #modal .box { background:var(--panel); border-radius:10px; max-width:92vw; max-height:92vh; overflow:auto; padding:1rem; }
    #modal img, #modal iframe { max-width:86vw; max-height:76vh; border:0; background:#fff; }
    #modal pre, #modal textarea { width:80vw; max-height:70vh; overflow:auto; white-space:pre-wrap; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:.6rem; }
    #modal textarea { height:60vh; font-family:monospace; }
    .tabs { display:flex; gap:.4rem; margin-bottom:1rem; }
    .tabs button.active { outline:2px solid var(--accent); }
    /* --- v3.31 UX & toegankelijkheid --- */
    /* Toegankelijkheid: duidelijke focus + skip-link (WCAG). */
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    .skip-link { position:absolute; left:-999px; top:0; background:var(--accent); color:#04283a; padding:.5rem 1rem; border-radius:0 0 6px 0; z-index:100; }
    .skip-link:focus { left:0; }
    /* Dashboard: vastgezette mappen + recent. */
    #dashboard { display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1rem; }
    #dashboard .panel { flex:1; min-width:200px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:.6rem .8rem; }
    #dashboard h3 { margin:.1rem 0 .4rem; font-size:.8rem; color:var(--muted); text-transform:uppercase; }
    #dashboard a { color:var(--accent); cursor:pointer; text-decoration:none; display:block; padding:.15rem 0; }
    /* Rasterweergave. */
    body.view-grid #rows { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.6rem; }
    body.view-grid #rows tr { display:flex; flex-direction:column; align-items:center; text-align:center; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:.6rem; }
    body.view-grid #rows td { border:0; padding:.2rem; }
    body.view-grid thead, body.view-grid td:first-child { display:none; }
    /* Kolom-zichtbaarheid. */
    body.hide-size .col-size, body.hide-size td:nth-child(3) { display:none; }
    /* Laagbandbreedte: geen thumbnails, geen animaties. */
    body.lowbw .thumb { display:none !important; }
    body.lowbw * { transition:none !important; animation:none !important; }
    /* Kioskmodus: verberg muterende/beheer-knoppen. */
    body.kiosk #adminBtn, body.kiosk #drop, body.kiosk .bar button:not(#refreshBtn), body.kiosk .actions .danger,
    body.kiosk [data-ren], body.kiosk [data-del], body.kiosk [data-share], body.kiosk [data-grant], body.kiosk [data-media] { display:none !important; }
    body.kiosk .tabs { display:none; }
  </style>
</head>
<body>
  <a href="#rows" class="skip-link">Naar de bestandenlijst</a>
  <header>
    <h1>📁 SFTP Fileserver</h1>
    <span class="quota" id="quota"></span>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="ghost" id="adminBtn" style="display:none" data-i18n="admin">Beheer</button>
    <button class="ghost" id="2faBtn" data-i18n="twofa">2FA</button>
    <button class="ghost" id="passkeyBtn" title="Passkey toevoegen">🔑</button>
    <button class="ghost" id="sessionsBtn" title="Actieve sessies">🖥️</button>
    <button class="ghost" id="secBtn" title="Apparaten & beveiliging">🔒dev</button>
    <button class="ghost" id="autoBtn" title="Automatisering & abonnementen">⚙️auto</button>
    <button class="ghost" id="notifBtn" title="Meldingen">🔔<span id="notifCount" style="display:none;background:var(--danger,#ef4444);color:#fff;border-radius:8px;padding:0 5px;font-size:.7rem;margin-left:2px"></span></button>
    <button class="ghost" id="apikeyBtn" title="API-sleutels">🔑api</button>
    <button class="ghost" id="snapBtn" title="Snapshots">📸</button>
    <button class="ghost" id="jitBtn" title="Tijdelijke rechten aanvragen (JIT)">🛡️</button>
    <button class="ghost" id="teamsBtn" title="Gedeelde teamruimtes">🧑‍🤝‍🧑</button>
    <button class="ghost" id="pwBtn" title="Wachtwoord wijzigen">🔑pw</button>
    <button class="ghost" id="viewBtn" title="Weergave wisselen (lijst/raster)" aria-label="Weergave wisselen">📊</button>
    <button class="ghost" id="lowbwBtn" title="Laagbandbreedte-modus (geen thumbnails)" aria-label="Laagbandbreedte-modus">🐢</button>
    <button class="ghost" id="kioskBtn" title="Kioskmodus (vergrendelde weergave)" aria-label="Kioskmodus">🔒kiosk</button>
    <button class="ghost" id="langBtn" aria-label="Taal wisselen">EN</button>
    <button class="ghost" id="themeBtn" title="Thema wisselen (donker/licht/auto)">🌓</button>
    <button class="ghost" id="hcBtn" title="Hoog contrast (toegankelijkheid)">◐</button>
    <button class="ghost" id="logoutBtn" data-i18n="logout">Uitloggen</button>
  </header>
  <main>
    <div class="tabs">
      <button data-tab="files" class="active" data-i18n="files">Bestanden</button>
      <button data-tab="shared" data-i18n="shared">Gedeeld met mij</button>
      <button data-tab="trash" data-i18n="trash">Prullenbak</button>
    </div>

    <div id="filesView">
      <div id="dashboard" aria-label="Snelkoppelingen en recente bestanden"></div>
      <div class="bar"><div class="crumbs" id="crumbs"></div></div>
      <div id="drop"><span data-i18n="drophint">Sleep bestanden hierheen, of</span>
        <label style="color:var(--accent);cursor:pointer;text-decoration:underline;">
          <span data-i18n="choose">kies bestanden</span><input type="file" id="fileInput" multiple hidden></label>
        &nbsp;/&nbsp;
        <label style="color:var(--accent);cursor:pointer;text-decoration:underline;">
          <span data-i18n="choosedir">map</span><input type="file" id="dirInput" webkitdirectory hidden></label>
        &nbsp;/&nbsp;
        <label style="color:var(--accent);cursor:pointer;text-decoration:underline;">
          📷 foto<input type="file" id="camInput" accept="image/*" capture="environment" multiple hidden></label>
        <div id="progress"><div></div></div>
        <div style="margin-top:.6rem;font-size:.85rem"><label><input type="checkbox" id="encToggle"> 🔒 Versleutel uploads (end-to-end)</label></div>
      </div>
      <div class="bar">
        <button class="ghost" id="mkdirBtn" data-i18n="newfolder">＋ Nieuwe map</button>
        <button class="ghost" id="newfileBtn" data-i18n="newfile">＋ Nieuw bestand</button>
        <button class="ghost" id="dropLinkBtn" title="Deel een link waarmee anderen hier kunnen uploaden">📤 Drop-link</button>
        <button class="ghost" id="galleryBtn" title="Galerij van afbeeldingen in deze map">🖼️ Galerij</button>
        <button class="ghost" id="dupBtn" title="Duplicaten opsporen en opruimen">🧬 Duplicaten</button>
        <button class="ghost" id="savedBtn" title="Opgeslagen zoekopdrachten">⭐ Zoekopdrachten</button>
        <button class="ghost" id="bulkDl" data-i18n="bulkdl">Download selectie</button>
        <button class="ghost" id="bulkMove">Verplaats selectie</button>
        <button class="ghost" id="bulkTag" title="Tag toevoegen aan de selectie">🏷️ Tag selectie</button>
        <button class="ghost" id="tagGalBtn" title="Bestanden met een tag tonen">🏷️ Tag-galerij</button>
        <button class="danger" id="bulkDel" data-i18n="bulkdel">Verwijder selectie</button>
        <button class="ghost" id="refreshBtn">↻</button>
        <input type="search" id="search" data-i18n-ph="searchph" placeholder="Zoeken…" />
        <label class="muted" title="Ook in bestandsinhoud zoeken"><input type="checkbox" id="contentSearch"> inhoud</label>
        <select id="sort"><option value="name">naam</option><option value="size">grootte</option><option value="mtime">datum</option></select>
        <select id="order"><option value="asc">↑</option><option value="desc">↓</option></select>
      </div>
      <table><thead><tr><th style="width:24px"></th><th data-i18n="col_name">Naam</th><th data-i18n="col_size">Grootte</th><th style="text-align:right" data-i18n="col_actions">Acties</th></tr></thead><tbody id="rows"></tbody></table>
    </div>

    <div id="sharedView" style="display:none"></div>
    <div id="trashView" style="display:none"></div>
  </main>

  <div id="modal"><div class="box"><button class="ghost" id="modalClose" style="float:right">✕</button><div id="modalBody"></div></div></div>

  <script src="/crypto.js"></script>
  <script src="/keyring.js"></script>
  <script src="/rsync.js"></script>
  <script src="/webauthn.js"></script>
  <script src="/app.js"></script>
</body>
</html>
