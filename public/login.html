<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inloggen — SFTP Fileserver</title>
  <link rel="manifest" href="/manifest.json" />
  <script>(function(){try{var s=localStorage.getItem('style')||{dark:'donker',light:'licht',auto:'systeem'}[localStorage.getItem('theme')]||localStorage.getItem('styleDefault')||'systeem';if(s==='systeem')s=matchMedia('(prefers-color-scheme: light)').matches?'licht':'donker';document.documentElement.setAttribute('data-style',s);}catch(e){}})();</script>
  <link rel="stylesheet" href="/themes.css" />
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .card { background:var(--panel); padding:2rem; border-radius:12px; width:320px; }
    h1 { font-size:1.2rem; margin:0 0 1.2rem; }
    label { display:block; font-size:.85rem; color:var(--muted); margin:.7rem 0 .2rem; }
    input { width:100%; padding:.6rem; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
    button { width:100%; margin-top:1.2rem; padding:.65rem; border:0; border-radius:6px; background:var(--accent); color:var(--accent-contrast); font-weight:700; cursor:pointer; }
    .err { color:var(--danger); font-size:.85rem; margin-top:.8rem; min-height:1rem; }
    #totp { display:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📁 SFTP Fileserver</h1>
    <form id="form">
      <label>Gebruikersnaam</label>
      <input id="username" autocomplete="username" autofocus />
      <label>Wachtwoord</label>
      <input id="password" type="password" autocomplete="current-password" />
      <div id="totp"><label>2FA-code</label><input id="token" inputmode="numeric" autocomplete="one-time-code" /></div>
      <button type="submit">Inloggen</button>
      <a id="sso" href="/api/oidc/login" style="display:none;margin-top:.8rem;text-align:center;color:var(--accent)">Inloggen met SSO</a>
      <button type="button" id="passkeyLogin" style="width:100%;margin-top:.6rem;background:var(--border);color:var(--text);display:none">🔑 Inloggen met passkey</button>
      <button type="button" id="magicLink" style="width:100%;margin-top:.6rem;background:var(--border);color:var(--text)">✉️ Stuur inloglink</button>
      <a href="/reset.html" style="display:block;margin-top:.8rem;text-align:center;color:var(--muted);font-size:.85rem">Wachtwoord vergeten?</a>
      <div class="err" id="err"></div>
    </form>
  </div>
  <script src="/webauthn.js"></script>
  <script>
    fetch('/api/oidc/enabled').then(r=>r.json()).then(d=>{ if(d.enabled){ const s=document.getElementById('sso'); s.style.display='block'; } }).catch(()=>{});
    fetch('/api/webauthn/enabled').then(r=>r.json()).then(d=>{ if(d.enabled) document.getElementById('passkeyLogin').style.display='block'; }).catch(()=>{});
    document.getElementById('passkeyLogin').onclick = async () => {
      const username = document.getElementById('username').value;
      if (!username) { document.getElementById('err').textContent='Vul eerst je gebruikersnaam in.'; return; }
      try {
        const opts = await (await fetch('/api/webauthn/login/options',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})})).json();
        const assertion = await window.fseWebAuthnGet(opts);
        const r = await fetch('/api/webauthn/login/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,response:assertion})});
        if (r.ok) window.location='/'; else document.getElementById('err').textContent='Passkey-login mislukt';
      } catch(e){ document.getElementById('err').textContent='Passkey-login mislukt: '+e.message; }
    };
    const form = document.getElementById('form');
    form.onsubmit = async (e) => {
      e.preventDefault();
      const body = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        token: document.getElementById('token').value,
      };
      const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      if (data.need2fa) {
        document.getElementById('totp').style.display = 'block';
        document.getElementById('err').textContent = 'Voer je 2FA-code (of een herstelcode) in.';
        document.getElementById('token').focus();
        return;
      }
      if (res.ok && data.mustEnroll2fa) { window.location = '/?enroll2fa=1'; return; }
      if (res.ok && data.ok) { window.location = '/'; return; }
      document.getElementById('err').textContent = data.error || 'Inloggen mislukt';
    };
    // Magic-link: stuur een inloglink per e-mail.
    const ml = document.getElementById('magicLink');
    if (ml) ml.onclick = async () => {
      const u = document.getElementById('username').value;
      if (!u) { document.getElementById('err').textContent = 'Vul eerst je gebruikersnaam in.'; return; }
      await fetch('/api/login/magic', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: u }) });
      document.getElementById('err').style.color = '#4ade80';
      document.getElementById('err').textContent = 'Als je account een e-mailadres heeft, is er een inloglink verstuurd.';
    };
  </script>
</body>
</html>
