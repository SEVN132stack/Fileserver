<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wachtwoord resetten — SFTP Fileserver</title>
  <script>(function(){try{var s=localStorage.getItem('style')||{dark:'donker',light:'licht',auto:'systeem'}[localStorage.getItem('theme')]||localStorage.getItem('styleDefault')||'systeem';if(s==='systeem')s=matchMedia('(prefers-color-scheme: light)').matches?'licht':'donker';document.documentElement.setAttribute('data-style',s);}catch(e){}})();</script>
  <link rel="stylesheet" href="/themes.css" />
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .card { background:var(--panel); padding:2rem; border-radius:12px; width:320px; }
    h1 { font-size:1.1rem; }
    label { display:block; font-size:.85rem; color:var(--muted); margin:.7rem 0 .2rem; }
    input { width:100%; padding:.6rem; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
    button { width:100%; margin-top:1.2rem; padding:.65rem; border:0; border-radius:6px; background:var(--accent); color:var(--accent-contrast); font-weight:700; cursor:pointer; }
    .msg { margin-top:.8rem; font-size:.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wachtwoord resetten</h1>
    <div id="requestForm">
      <p class="msg" style="color:var(--muted)">Vul je gebruikersnaam in; je ontvangt een resetlink.</p>
      <label>Gebruikersnaam</label><input id="username">
      <button id="reqBtn">Stuur resetlink</button>
    </div>
    <div id="confirmForm" style="display:none">
      <label>Nieuw wachtwoord</label><input id="password" type="password">
      <div style="height:5px;border-radius:3px;background:var(--border);margin-top:.4rem;overflow:hidden"><div id="pwbar" style="height:100%;width:0;transition:.2s"></div></div>
      <div id="pwlabel" style="font-size:.75rem;color:var(--muted);margin-top:.2rem"></div>
      <button id="confBtn">Wachtwoord instellen</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const msg = document.getElementById('msg');
    if (token) { document.getElementById('requestForm').style.display='none'; document.getElementById('confirmForm').style.display='block'; }
    document.getElementById('reqBtn').onclick = async () => {
      await fetch('/api/reset/request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: document.getElementById('username').value }) });
      msg.style.color = '#4ade80';
      msg.textContent = 'Als het account bestaat, is er een resetlink verstuurd (of gelogd op de server).';
    };
    // Wachtwoordsterkte-meter (indicatief).
    function pwScore(pw) {
      let s = 0;
      if (pw.length >= 8) s++;
      if (pw.length >= 12) s++;
      if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
      if (/[0-9]/.test(pw)) s++;
      if (/[^A-Za-z0-9]/.test(pw)) s++;
      return Math.min(s, 4);
    }
    const pwInput = document.getElementById('password');
    if (pwInput) pwInput.addEventListener('input', () => {
      const labels = ['zeer zwak','zwak','redelijk','sterk','zeer sterk'];
      const colors = ['#f87171','#fb923c','#facc15','#4ade80','#22c55e'];
      const sc = pwScore(pwInput.value);
      const bar = document.getElementById('pwbar');
      bar.style.width = pwInput.value ? ((sc+1)/5*100)+'%' : '0';
      bar.style.background = colors[sc];
      document.getElementById('pwlabel').textContent = pwInput.value ? labels[sc] : '';
    });
    document.getElementById('confBtn').onclick = async () => {
      const r = await fetch('/api/reset/confirm', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token, password: document.getElementById('password').value }) });
      const d = await r.json().catch(()=>({}));
      if (r.ok && d.ok) { msg.style.color='#4ade80'; msg.textContent='Wachtwoord gewijzigd. Je kunt inloggen.'; setTimeout(()=>location='/login.html', 1500); }
      else { msg.style.color='#f87171'; msg.textContent = d.error || 'Mislukt'; }
    };
  </script>
</body>
</html>
