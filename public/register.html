<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registreren — Fileserver</title>
  <script>(function(){try{var s=localStorage.getItem('style')||{dark:'donker',light:'licht',auto:'systeem'}[localStorage.getItem('theme')]||localStorage.getItem('styleDefault')||'systeem';if(s==='systeem')s=matchMedia('(prefers-color-scheme: light)').matches?'licht':'donker';document.documentElement.setAttribute('data-style',s);}catch(e){}})();</script>
  <link rel="stylesheet" href="/themes.css" />
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .card { background:var(--panel); padding:2rem; border-radius:12px; width:320px; }
    h1 { font-size:1.1rem; } label { display:block; font-size:.85rem; color:var(--muted); margin:.7rem 0 .2rem; }
    input { width:100%; padding:.6rem; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); box-sizing:border-box; }
    button { width:100%; margin-top:1.2rem; padding:.65rem; border:0; border-radius:6px; background:var(--accent); color:var(--accent-contrast); font-weight:700; cursor:pointer; }
    .msg { margin-top:.8rem; font-size:.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Account aanmaken</h1>
    <label>Invite-code</label><input id="code">
    <label>Gebruikersnaam</label><input id="username">
    <label>Wachtwoord</label><input id="password" type="password">
    <label>E-mail (optioneel)</label><input id="email" type="email">
    <button id="go">Registreren</button>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('code')) document.getElementById('code').value = q.get('code');
    document.getElementById('go').onclick = async () => {
      const body = { code: document.getElementById('code').value, username: document.getElementById('username').value, password: document.getElementById('password').value, email: document.getElementById('email').value };
      const r = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const d = await r.json().catch(()=>({}));
      const m = document.getElementById('msg');
      if (r.ok && d.ok) { m.style.color='#4ade80'; m.textContent='Account aangemaakt. Je kunt inloggen.'; setTimeout(()=>location='/login.html', 1500); }
      else { m.style.color='#f87171'; m.textContent = d.error || 'Registratie mislukt'; }
    };
  </script>
</body>
</html>
