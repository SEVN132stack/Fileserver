<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Fileserver</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:system-ui,sans-serif; background:#0f172a; color:#e2e8f0; text-align:center; }
    .card { padding:2rem; }
    h1 { font-size:1.3rem; } p { color:#94a3b8; }
    button { margin-top:1rem; padding:.6rem 1.2rem; border:0; border-radius:6px; background:#38bdf8; color:#04283a; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📴 Je bent offline</h1>
    <p>De fileserver is nu niet bereikbaar. Controleer je verbinding en probeer opnieuw.</p>
    <button onclick="location.reload()">Opnieuw proberen</button>
  </div>
</body>
</html>
