version: 2
updates:
  # npm-afhankelijkheden maandelijks bijwerken via PR's. Wekelijks met een
  # limiet van 10 leverde tientallen CI-runs per batch op.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  # GitHub Actions zelf ook up-to-date houden.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
