version: 2
updates:
  # npm-afhankelijkheden wekelijks bijwerken via PR's.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  # GitHub Actions zelf ook up-to-date houden.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
