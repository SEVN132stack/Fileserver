version: 2
updates:
  # npm-afhankelijkheden maandelijks bijwerken via PR's. Wekelijks met een
  # limiet van 10 leverde tientallen CI-runs per batch op.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # archiver 8.0.0 is een ESM-migratie zonder default-export, waar
      # src/backup.js op stukloopt (`import archiver from 'archiver'`). Zolang
      # die import niet is omgezet, sleept de major de hele production-groep
      # mee de rode CI in. Minor/patch blijven gewoon komen.
      - dependency-name: archiver
        update-types: [version-update:semver-major]
  # GitHub Actions zelf ook up-to-date houden.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
