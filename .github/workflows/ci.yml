name: CI

on:
  # Met de hand te starten vanuit het Actions-tabblad. Zonder dit is een
  # commit de enige manier om te controleren of de eigen runner werkt — juist
  # wat je niet wilt doen als je daaraan twijfelt.
  workflow_dispatch:
  push:
    # Alleen de langlevende branches; feature-branches worden al door
    # pull_request gedekt. Voorheen ('**') draaide elke commit de CI twee keer.
    branches:
      - main
      - claude/sftp-server-web-ui-ptwzzo
  pull_request:

# Een nieuwe push annuleert de nog lopende run op dezelfde ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # test en audit deelden dezelfde checkout + npm ci; als aparte jobs betaalden
  # we die installatie (en de afronding naar een hele minuut) dubbel.
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Faal de build bij bekende kwetsbaarheden (hoog/kritiek) in dependencies.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache Playwright-browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installeer Playwright (browser + systeemdeps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Installeer alleen systeemdeps (browser uit cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e

  # Statische controle op de shellscripts: deploy, rooktest, back-up en de
  # meldingen. Die scripts draaien ongezien op de NAS, dus een quoting-fout of
  # een `cd` die faalt merk je pas als er iets misgaat op het verkeerde moment.
  #
  # Niveau 'warning': errors en warnings blokkeren, info-meldingen (stijl) niet.
  scripts:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          bestanden=$(find . -name '*.sh' -not -path './vendor/*' -not -path './node_modules/*' | sort)
          if [ -z "$bestanden" ]; then
            echo "Geen shellscripts gevonden."
            exit 0
          fi
          echo "$bestanden" | sed 's/^/  /'
          # shellcheck-versies verschillen in wat ze standaard meenemen; -x volgt
          # `source`-regels zodat een gedeelde helper ook echt gecontroleerd wordt.
          shellcheck -x -S warning $bestanden

  # Meldt de uitslag in Discord. De webhook komt uit de omgeving van de
  # runner-container (per app een andere), dus er hoeft in deze repo geen
  # secret te staan — en een fork of PR kan er niet bij.
  #
  # Rood melden we altijd, ook op een feature-branch: dat is het bericht dat je
  # meteen wilt zien. Groen alleen op main, anders loopt het kanaal vol met
  # bevestigingen van dingen die je toch al in de PR ziet.
  melden:
    needs: [test, e2e, scripts]
    if: always()
    runs-on: self-hosted
    permissions:
      # Voor het opvragen van de jobs van deze run: namen, duur en de stap
      # waarop een job strandde. Dat staat niet in de needs-context.
      actions: read
      contents: read
    steps:
      - name: Uitslag naar Discord
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          TITEL: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
        run: |
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "Geen webhook in de runner-omgeving — niets gemeld."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime

          UA = "nas-ci/1.0 (+https://github.com/SEVN132stack)"
          TEKEN = {"success": "✓", "failure": "✗", "cancelled": "⊘",
                   "skipped": "–", "timed_out": "⏱", "neutral": "–"}

          def api(pad):
              req = urllib.request.Request(
                  os.environ["API"] + pad,
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json", "User-Agent": UA})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          def duur(a, b):
              if not a or not b:
                  return ""
              try:
                  d = datetime.fromisoformat(b.replace("Z", "+00:00")) - datetime.fromisoformat(a.replace("Z", "+00:00"))
              except ValueError:
                  return ""
              s = int(d.total_seconds())
              return "" if s <= 0 else (f"{s}s" if s < 90 else f"{s // 60}m{s % 60:02d}")

          # De meldjob draait nu zelf nog; die hoort niet in het overzicht.
          jobs = [j for j in api(f"/actions/runs/{os.environ['RUN_ID']}/jobs?per_page=100")["jobs"]
                  if j.get("status") == "completed"]
          rood = any(j.get("conclusion") == "failure" for j in jobs)
          branch, repo = os.environ["BRANCH"], os.environ["REPO"].split("/")[-1]

          # Groen op een feature-branch: stil. De PR toont het al.
          if not rood and branch != "main":
              print("Groen op een branch — niet gemeld.")
              raise SystemExit

          regels = []
          for j in sorted(jobs, key=lambda x: x.get("started_at") or ""):
              t = duur(j.get("started_at"), j.get("completed_at"))
              regels.append(f"{TEKEN.get(j.get('conclusion'), '•')} {j['name']}" + (f" — {t}" if t else ""))
              # Bij een gezakte job: de stap waarop hij strandde. Dat scheelt het
              # openklappen van de run om te zien waar het misging.
              if j.get("conclusion") == "failure":
                  stap = next((s["name"] for s in j.get("steps", []) if s.get("conclusion") == "failure"), None)
                  if stap:
                      regels.append(f"   ↳ gestruikeld bij: {stap}")

          totaal = duur(min((j.get("started_at") or "" for j in jobs), default=""),
                        max((j.get("completed_at") or "" for j in jobs), default=""))
          kop = f"Commit `{os.environ['SHA'][:8]}` ({os.environ['EVENT']})" + (f" · {totaal}" if totaal else "")
          onderwerp = (os.environ.get("TITEL") or "").split("\n")[0][:100]

          tekst = "\n".join([kop] + ([f"_{onderwerp}_"] if onderwerp else []) + ["", *regels, "",
                                     f"[Run bekijken]({os.environ['RUN_URL']})"])
          titel = f"❌ {repo}: CI rood op {branch}" if rood else f"✅ {repo}: CI groen op main"
          data = json.dumps({"embeds": [{"title": titel, "description": tekst,
                                         "color": 15158332 if rood else 3066993}]}).encode()
          req = urllib.request.Request(os.environ["DISCORD_WEBHOOK"], data=data,
                                       headers={"Content-Type": "application/json", "User-Agent": UA})
          try:
              urllib.request.urlopen(req, timeout=15)
              print(f"Gemeld: {titel}")
          except Exception as e:
              # Een mislukte melding mag de CI niet rood maken.
              print(f"Melden mislukt: {e}")
          PY
