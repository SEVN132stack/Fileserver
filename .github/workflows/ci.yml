name: CI

on:
  push:
    # Alleen de langlevende branches; feature-branches worden al door
    # pull_request gedekt. Voorheen ('**') draaide elke commit de CI twee keer.
    branches:
      - main
      - claude/sftp-server-web-ui-ptwzzo
  pull_request:

# Een nieuwe push annuleert de nog lopende run op dezelfde ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # test en audit deelden dezelfde checkout + npm ci; als aparte jobs betaalden
  # we die installatie (en de afronding naar een hele minuut) dubbel.
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Faal de build bij bekende kwetsbaarheden (hoog/kritiek) in dependencies.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache Playwright-browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installeer Playwright (browser + systeemdeps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Installeer alleen systeemdeps (browser uit cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e
