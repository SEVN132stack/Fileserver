name: Docker image

# Draait pas nadat de CI-workflow op main is geslaagd, zodat een gebroken commit
# nooit een image naar :latest pusht (en dus niet door Watchtower wordt
# uitgerold). Tags blijven op push draaien: die zet een mens bewust neer.
# workflow_dispatch blijft beschikbaar om handmatig te (her)publiceren.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Alleen bouwen als de CI slaagde (of bij een tag/handmatige trigger).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Bouw exact de commit die de CI groen maakte (bij workflow_run).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'push' }}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
