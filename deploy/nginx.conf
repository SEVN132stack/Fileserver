# Nginx reverse proxy met TLS. Verkrijg eerst een certificaat, bijvoorbeeld met
# certbot:  sudo certbot --nginx -d files.voorbeeld.nl
# Vervang de domeinnaam en certificaatpaden.

server {
    listen 80;
    server_name files.voorbeeld.nl;
    # Stuur HTTP door naar HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name files.voorbeeld.nl;

    ssl_certificate     /etc/letsencrypt/live/files.voorbeeld.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.voorbeeld.nl/privkey.pem;

    # Sta grote uploads toe (pas aan naar wens).
    client_max_body_size 10G;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Echte client-IP doorgeven (nodig voor rate limiting/bans).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (realtime updates): geen buffering, lange time-out.
        proxy_buffering off;
        proxy_read_timeout 3600s;

        # WebDAV-methodes toestaan (PROPFIND, MKCOL, MOVE, ...).
        proxy_set_header Destination $http_destination;
    }
}
